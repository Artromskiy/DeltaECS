name: ECS benchmarks

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to run
        required: true
        default: full-comparison
        type: choice
        options:
          - full-comparison
          - iteration
          - structural-list
          - structural-query
          - structural-atomic
          - version-comparison
      baseline_ref:
        description: Baseline DeltaECS git ref for version-comparison
        required: true
        default: main
        type: string
      candidate_ref:
        description: Candidate DeltaECS git ref for version-comparison
        required: true
        default: main
        type: string
      warmup_count:
        description: BenchmarkDotNet warm-up iterations
        required: true
        default: 3
        type: number
      iteration_count:
        description: BenchmarkDotNet measurement iterations
        required: true
        default: 5
        type: number
      launch_count:
        description: Number of isolated benchmark launches
        required: true
        default: 1
        type: number
      runner:
        description: Standard GitHub-hosted runner architecture
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  smoke:
    name: Build, tests, benchmark smoke
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ecs-benchmarks-smoke-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore DeltaECS.sln
          dotnet restore benchmarks/DeltaECS.Benchmarks/DeltaECS.Benchmarks.csproj

      - name: Build and test
        run: |
          dotnet build DeltaECS.sln -c Release --no-restore
          dotnet test tests/DeltaECSTests/DeltaECSTests.csproj -c Release --no-build --no-restore
          dotnet build benchmarks/DeltaECS.Benchmarks/DeltaECS.Benchmarks.csproj -c Release --no-restore

      - name: Record runner information
        run: |
          mkdir -p artifacts/ci-smoke
          uname -a > artifacts/ci-smoke/runner.txt
          lscpu >> artifacts/ci-smoke/runner.txt
          dotnet --info >> artifacts/ci-smoke/runner.txt

      - name: Run comparative contract and discovery smoke
        run: |
          dotnet benchmarks/DeltaECS.Benchmarks/bin/Release/net8.0/DeltaECS.Benchmarks.dll contract-smoke
          dotnet benchmarks/DeltaECS.Benchmarks/bin/Release/net8.0/DeltaECS.Benchmarks.dll \
            full-comparison \
            --list flat \
            --filter '*'

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecs-benchmark-smoke-${{ github.run_number }}
          path: artifacts/ci-smoke
          if-no-files-found: warn
          retention-days: 7

  full:
    name: Full comparative benchmark
    if: (github.event_name == 'workflow_dispatch' && inputs.suite != 'version-comparison') || github.event_name == 'schedule'
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 360
    concurrency:
      group: ecs-benchmarks-full-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      BENCHMARK_SUITE: ${{ inputs.suite || 'full-comparison' }}
      WARMUP_COUNT: ${{ inputs.warmup_count || 3 }}
      ITERATION_COUNT: ${{ inputs.iteration_count || 5 }}
      LAUNCH_COUNT: ${{ inputs.launch_count || 1 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore, build, and test
        run: |
          dotnet restore DeltaECS.sln
          dotnet restore benchmarks/DeltaECS.Benchmarks/DeltaECS.Benchmarks.csproj
          dotnet build DeltaECS.sln -c Release --no-restore
          dotnet test tests/DeltaECSTests/DeltaECSTests.csproj -c Release --no-build --no-restore
          dotnet build benchmarks/DeltaECS.Benchmarks/DeltaECS.Benchmarks.csproj -c Release --no-restore

      - name: Record runner information
        run: |
          mkdir -p artifacts/github-full
          uname -a > artifacts/github-full/runner.txt
          lscpu >> artifacts/github-full/runner.txt
          dotnet --info >> artifacts/github-full/runner.txt
          printf 'suite=%s\nwarmup=%s\niterations=%s\nlaunches=%s\n' \
            "$BENCHMARK_SUITE" "$WARMUP_COUNT" "$ITERATION_COUNT" "$LAUNCH_COUNT" \
            >> artifacts/github-full/runner.txt

      - name: Run comparative benchmarks
        run: |
          dotnet benchmarks/DeltaECS.Benchmarks/bin/Release/net8.0/DeltaECS.Benchmarks.dll \
            "$BENCHMARK_SUITE" \
            --filter '*' \
            --warmupCount "$WARMUP_COUNT" \
            --iterationCount "$ITERATION_COUNT" \
            --launchCount "$LAUNCH_COUNT" \
            --exporters json csv markdown github \
            --artifacts artifacts/github-full \
            --combined-report artifacts/github-full

      - name: Add results to workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## DeltaECS benchmark"
            echo
            echo "Suite: \`$BENCHMARK_SUITE\` · runner: \`${{ runner.os }} ${{ runner.arch }}\`"
            echo
            if [ -f artifacts/github-full/comparative-report.md ]; then
              echo "### Combined capability report"
              echo
              cat artifacts/github-full/comparative-report.md
            else
              echo "The combined report was not produced. Raw reports are listed below; full files are available in the uploaded artifact."
              echo
              while IFS= read -r report; do
                echo "### $(basename "$report")"
                echo
                sed -n '1,140p' "$report"
                echo
              done < <(find artifacts/github-full -type f -name '*-report-github.md' | sort)
            fi
            echo
            echo "Raw BenchmarkDotNet reports and runner metadata are available in the uploaded artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecs-benchmarks-${{ env.BENCHMARK_SUITE }}-${{ runner.arch }}-${{ github.run_number }}
          path: artifacts/github-full
          if-no-files-found: warn
          retention-days: 30

  versions:
    name: DeltaECS version comparison
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'version-comparison'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    concurrency:
      group: ecs-version-comparison-${{ inputs.baseline_ref }}-${{ inputs.candidate_ref }}-${{ inputs.runner }}
      cancel-in-progress: false
    env:
      BASELINE_ROOT: ${{ github.workspace }}/baseline
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
      HARNESS_ROOT: ${{ github.workspace }}/harness
      WARMUP_COUNT: ${{ inputs.warmup_count }}
      ITERATION_COUNT: ${{ inputs.iteration_count }}
      LAUNCH_COUNT: ${{ inputs.launch_count }}

    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@v7
        with:
          path: harness

      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline

      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate

      - name: Install .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-version-${{ runner.os }}-${{ inputs.baseline_ref }}-${{ inputs.candidate_ref }}-${{ hashFiles('harness/benchmarks/DeltaECS.VersionBenchmarks/**/*.csproj') }}
          restore-keys: |
            nuget-version-${{ runner.os }}-

      - name: Build and test both versions
        shell: bash
        run: |
          for root in "$BASELINE_ROOT" "$CANDIDATE_ROOT"; do
            dotnet restore "$root/DeltaECS.sln"
            dotnet build "$root/DeltaECS.sln" -c Release --no-restore
            dotnet test "$root/tests/DeltaECSTests/DeltaECSTests.csproj" -c Release --no-build --no-restore
          done

      - name: Restore and build version suite
        working-directory: harness
        run: |
          dotnet restore benchmarks/DeltaECS.VersionBenchmarks/DeltaECS.VersionBenchmarks.csproj \
            --disable-parallel \
            -p:BaselineRoot="$BASELINE_ROOT" \
            -p:CandidateRoot="$CANDIDATE_ROOT"
          dotnet build benchmarks/DeltaECS.VersionBenchmarks/DeltaECS.VersionBenchmarks.csproj \
            -c Release --no-restore --disable-build-servers -m:1 /p:UseSharedCompilation=false \
            -p:BaselineRoot="$BASELINE_ROOT" \
            -p:CandidateRoot="$CANDIDATE_ROOT"

      - name: Run version contract smoke
        working-directory: harness
        run: |
          dotnet benchmarks/DeltaECS.VersionBenchmarks/bin/Release/net8.0/DeltaECS.VersionBenchmarks.dll smoke
          dotnet benchmarks/DeltaECS.VersionBenchmarks/bin/Release/net8.0/DeltaECS.VersionBenchmarks.dll \
            --list flat --filter '*'

      - name: Record runner and version information
        shell: bash
        run: |
          mkdir -p "$HARNESS_ROOT/artifacts/version-comparison"
          {
            echo "baseline_ref=${{ inputs.baseline_ref }}"
            echo "baseline_sha=$(git -C "$BASELINE_ROOT" rev-parse HEAD)"
            echo "candidate_ref=${{ inputs.candidate_ref }}"
            echo "candidate_sha=$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)"
            uname -a
            lscpu
            dotnet --info
          } > "$HARNESS_ROOT/artifacts/version-comparison/runner.txt"

      - name: Run version benchmarks
        working-directory: harness
        run: |
          dotnet benchmarks/DeltaECS.VersionBenchmarks/bin/Release/net8.0/DeltaECS.VersionBenchmarks.dll \
            --filter '*' \
            --warmupCount "$WARMUP_COUNT" \
            --iterationCount "$ITERATION_COUNT" \
            --launchCount "$LAUNCH_COUNT" \
            --exporters json csv markdown github \
            --artifacts artifacts/version-comparison

      - name: Add version results to workflow summary
        if: always()
        working-directory: harness
        shell: bash
        run: |
          {
            echo "## DeltaECS version comparison"
            echo
            echo "Baseline: `${{ inputs.baseline_ref }}` → Candidate: `${{ inputs.candidate_ref }}`"
            echo
            echo "Runner: `${{ runner.os }} ${{ runner.arch }}`"
            echo
            while IFS= read -r report; do
              cat "$report"
              echo
            done < <(find artifacts/version-comparison -type f -name '*-report-github.md' | sort)
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload version benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecs-version-${{ runner.arch }}-${{ github.run_number }}
          path: harness/artifacts/version-comparison
          if-no-files-found: warn
          retention-days: 30
