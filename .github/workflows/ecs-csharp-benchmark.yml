name: Ecs.CSharp.Benchmark

on:
  workflow_dispatch:
    inputs:
      entity_counts:
        description: Entity counts, comma-separated
        required: true
        default: "32,1024,131072,1048576"
        type: string
      min_iteration_count:
        description: Minimum BenchmarkDotNet measurement iterations
        required: true
        default: 20
        type: number
      iteration_time_ms:
        description: Target duration of each BenchmarkDotNet iteration in milliseconds
        required: true
        default: 200
        type: number

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  benchmark:
    name: Run benchmark matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: ecs-csharp-benchmark-${{ github.ref }}
      cancel-in-progress: false
    env:
      ENTITY_COUNTS: ${{ inputs.entity_counts }}
      MIN_ITERATION_COUNT: ${{ inputs.min_iteration_count }}
      ITERATION_TIME_MS: ${{ inputs.iteration_time_ms }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-ecs-csharp-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-ecs-csharp-${{ runner.os }}-

      - name: Restore and build benchmark
        run: |
          dotnet restore benchmarks/Ecs.CSharp.Benchmark/Ecs.CSharp.Benchmark.csproj
          dotnet build benchmarks/Ecs.CSharp.Benchmark/Ecs.CSharp.Benchmark.csproj \
            -c Release --no-restore -p:IncludeSlowBenchmarks=false

      - name: Record runner and benchmark configuration
        shell: bash
        run: |
          mkdir -p artifacts/ecs-csharp
          {
            echo "entity_counts=$ENTITY_COUNTS"
            echo "min_iteration_count=$MIN_ITERATION_COUNT"
            echo "iteration_time_ms=$ITERATION_TIME_MS"
            echo "slow_ecs=excluded (Morpeh, MonoGame.Extended, RelEcs, Svelto.ECS)"
            echo "simd=excluded"
            echo "thread_modes=Single-thread,Multi-thread"
            uname -a
            lscpu
            dotnet --info
          } > artifacts/ecs-csharp/runner.txt

      - name: Run Ecs.CSharp.Benchmark matrix
        shell: bash
        run: |
          if ! [[ "$MIN_ITERATION_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Minimum iteration count must be a positive integer."
            exit 1
          fi
          if ! [[ "$ITERATION_TIME_MS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Iteration time must be a positive integer in milliseconds."
            exit 1
          fi

          IFS=',' read -r -a entity_counts <<< "$ENTITY_COUNTS"
          if [ "${#entity_counts[@]}" -eq 0 ]; then
            echo "::error::At least one entity count is required."
            exit 1
          fi

          declare -A seen_counts=()
          for entity_count in "${entity_counts[@]}"; do
            entity_count="${entity_count//[[:space:]]/}"
            if ! [[ "$entity_count" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid entity count '$entity_count'. Use positive comma-separated integers."
              exit 1
            fi
            if [[ -n "${seen_counts[$entity_count]:-}" ]]; then
              echo "::error::Entity count '$entity_count' appears more than once."
              exit 1
            fi
            seen_counts[$entity_count]=1

            for thread_mode in SingleThread MultiThread; do
              category="$thread_mode"
              if [ "$thread_mode" = SingleThread ]; then
                category='Single-thread'
              else
                category='Multi-thread'
              fi
              mode_directory="artifacts/ecs-csharp/$entity_count/$thread_mode"
              echo "Running $thread_mode Ecs.CSharp.Benchmark with $entity_count entities"
              dotnet benchmarks/Ecs.CSharp.Benchmark/bin/Release/net10.0/Ecs.CSharp.Benchmark.dll \
                --amount "$entity_count" \
                --filter '*' \
                --allCategories "$category" \
                --job Default \
                --minIterationCount "$MIN_ITERATION_COUNT" \
                --iterationTime "$ITERATION_TIME_MS" \
                --exporters github csv json \
                --artifacts "$mode_directory"

              expected_suites=4
              if [ "$thread_mode" = SingleThread ]; then
                expected_suites=7
              fi
              report_count=$(find "$mode_directory" -type f -name '*-report-github.md' | wc -l | tr -d ' ')
              if [ "$report_count" -ne "$expected_suites" ]; then
                echo "::error::$thread_mode produced $report_count result tables for $entity_count entities; expected $expected_suites."
                exit 1
              fi

              python3 - "$mode_directory" <<'PY'
          import csv
          import glob
          import os
          import sys

          failures = []
          for path in glob.glob(os.path.join(sys.argv[1], "**", "*-report.csv"), recursive=True):
              with open(path, newline="", encoding="utf-8-sig") as source:
                  for result in csv.DictReader(source):
                      if result.get("Mean", "").strip().upper() == "NA":
                          failures.append(f"{os.path.basename(path)}: {result.get('Method', 'unknown method')}")

          if failures:
              print("BenchmarkDotNet produced NA means:", file=sys.stderr)
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          PY
            done
          done

      - name: Add benchmark winner summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import glob
          import os
          import re

          method_prefixes = (
              ("DeltaECSBatchGeneric", "DeltaECS"),
              ("DeltaECSBatch", "DeltaECS"),
              ("DeltaECS", "DeltaECS"),
              ("LeopotamEcsLite", "Leopotam.EcsLite"),
              ("LeopotamEcs", "Leopotam.Ecs"),
              ("FrifloEngineEcs", "FrifloEngineEcs"),
              ("DefaultEcs", "DefaultEcs"),
              ("MonoGameExtended", "MonoGame.Extended"),
              ("StaticEcsBatch", "StaticEcs"),
              ("StaticEcs", "StaticEcs"),
              ("SveltoECS", "Svelto.ECS"),
              ("FlecsNet", "FlecsNet"),
              ("Fennecs", "Fennecs"),
              ("HypEcs", "HypEcs"),
              ("Morpeh", "Morpeh"),
              ("Myriad", "Myriad.ECS"),
              ("RelEcs", "RelEcs"),
              ("TinyEcs", "TinyEcs"),
              ("Arch", "Arch"),
          )
          mean_pattern = re.compile(r"^\s*([0-9][0-9,.]*)\s*(ns|us|µs|ms|s)\s*$")
          unit_to_ns = {"ns": 1, "us": 1_000, "µs": 1_000, "ms": 1_000_000, "s": 1_000_000_000}

          def ecs_name(method):
              for prefix, name in method_prefixes:
                  if method.startswith(prefix):
                      return name
              return method

          def mean_ns(value):
              match = mean_pattern.match(value or "")
              if match is None:
                  return None
              number, unit = match.groups()
              return float(number.replace(",", "")) * unit_to_ns[unit]

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          entity_counts = [value.strip() for value in os.environ.get("ENTITY_COUNTS", "").split(",") if value.strip()]
          rows = []
          for entity_count in entity_counts:
              for thread_mode, mode_label in (("SingleThread", "Single-thread"), ("MultiThread", "Multi-thread")):
                  root = f"artifacts/ecs-csharp/{entity_count}/{thread_mode}"
                  for report in sorted(glob.glob(f"{root}/**/*-report.csv", recursive=True)):
                      suite = os.path.basename(report).removesuffix("-report.csv")
                      suite = suite.removeprefix("Ecs.CSharp.Benchmark.")
                      best_by_ecs = {}
                      with open(report, newline="", encoding="utf-8-sig") as source:
                          for result in csv.DictReader(source):
                              method = result.get("Method", "")
                              mean = mean_ns(result.get("Mean", ""))
                              if not method or mean is None:
                                  continue
                              name = ecs_name(method)
                              best_by_ecs[name] = min(mean, best_by_ecs.get(name, float("inf")))

                      ranked = sorted(best_by_ecs.items(), key=lambda entry: entry[1])
                      if ranked:
                          rows.append((suite, entity_count, mode_label, ranked))

          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write("## Results at a glance\n\n")
              summary.write("Each ECS is ranked by its fastest method in the test. The advantage compares the winner with the fastest different ECS name.\n\n")
              summary.write("| Test | Entities | Threads | Winner ECS | Advantage vs next ECS |\n")
              summary.write("|---|---:|---|---|---|\n")
              for suite, entity_count, mode_label, ranked in rows:
                  winner, winner_ns = ranked[0]
                  if len(ranked) > 1:
                      runner_up, runner_up_ns = ranked[1]
                      advantage = (runner_up_ns - winner_ns) / runner_up_ns * 100
                      comparison = f"{advantage:.1f}% vs {runner_up}"
                  else:
                      comparison = "—"
                  summary.write(f"| `{suite}` | {entity_count} | {mode_label} | **{winner}** | {comparison} |\n")
              if not rows:
                  summary.write("| No benchmark results available | — | — | — | — |\n")
              summary.write("\n")
          PY

      - name: Add result tables to workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Ecs.CSharp.Benchmark"
            echo
            printf 'Entities: `%s` · minimum iterations: `%s` · iteration target: `%s ms` · runner: `%s %s`\n' \
              "$ENTITY_COUNTS" "$MIN_ITERATION_COUNT" "$ITERATION_TIME_MS" \
              "${{ runner.os }}" "${{ runner.arch }}"
            echo
            echo '### Benchmark suites'
            echo
            echo '| Suite | Workload |'
            echo '|---|---|'
            echo '| `CreateEntityWithOneComponent` | Entity creation with one component |'
            echo '| `CreateEntityWithTwoComponents` | Entity creation with two components |'
            echo '| `CreateEntityWithThreeComponents` | Entity creation with three components |'
            echo '| `SystemWithOneComponent` | Iteration over one component |'
            echo '| `SystemWithTwoComponents` | Iteration over two components |'
            echo '| `SystemWithThreeComponents` | Iteration over three components |'
            echo '| `SystemWithTwoComponentsMultipleComposition` | Iteration over two components across multiple compositions |'
            echo
            echo 'Slow ECS adapters and SIMD benchmarks are excluded from these runs.'
            echo 'Each table marks the fastest DeltaECS entry as `Baseline`; ratios compare every entry to it.'
            echo

            IFS=',' read -r -a entity_counts <<< "$ENTITY_COUNTS"
            requested_count=0
            for entity_count in "${entity_counts[@]}"; do
              entity_count="${entity_count//[[:space:]]/}"
              if [[ "$entity_count" =~ ^[1-9][0-9]*$ ]]; then
                requested_count=$((requested_count + 1))
              fi
            done
            expected_report_count=$((requested_count * 11))
            report_count=0
            for entity_count in "${entity_counts[@]}"; do
              entity_count="${entity_count//[[:space:]]/}"
              if ! [[ "$entity_count" =~ ^[1-9][0-9]*$ ]]; then
                continue
              fi

              echo "### $entity_count entities"
              echo
              for thread_mode in SingleThread MultiThread; do
                if [ "$thread_mode" = SingleThread ]; then
                  mode_label='Single-thread'
                  expected_suites=7
                else
                  mode_label='Multi-thread'
                  expected_suites=4
                fi
                echo "#### $mode_label"
                echo
                mapfile -t reports < <(find "artifacts/ecs-csharp/$entity_count/$thread_mode" -type f -name '*-report-github.md' 2>/dev/null | sort)
                for report in "${reports[@]}"; do
                  report_count=$((report_count + 1))
                  suite="$(basename "$report" -report-github.md)"
                  suite="${suite#Ecs.CSharp.Benchmark.}"
                  case "$suite" in
                    CreateEntityWithOneComponent) description='Entity creation · one component' ;;
                    CreateEntityWithTwoComponents) description='Entity creation · two components' ;;
                    CreateEntityWithThreeComponents) description='Entity creation · three components' ;;
                    SystemWithOneComponent) description='Iteration · one component' ;;
                    SystemWithTwoComponents) description='Iteration · two components' ;;
                    SystemWithThreeComponents) description='Iteration · three components' ;;
                    SystemWithTwoComponentsMultipleComposition) description='Iteration · two components across multiple compositions' ;;
                    *) description='Benchmark suite' ;;
                  esac
                  echo "##### $suite — $description"
                  echo
                  cat "$report"
                  echo
                done
                echo "Tables: ${#reports[@]} / $expected_suites expected suites."
                echo
              done
            done

            echo "Result tables: $report_count / $expected_report_count expected suites."
            echo
            if [ "$report_count" -eq 0 ]; then
              echo 'No BenchmarkDotNet result tables were produced. See the job logs for the failure.'
            fi
            echo
            echo 'CSV, JSON and runner/runtime metadata are available in the uploaded artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecs-csharp-benchmark-${{ runner.arch }}-${{ github.run_number }}
          path: artifacts/ecs-csharp
          if-no-files-found: warn
          retention-days: 30
